version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    
  gateway-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: gateway-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka


  realtime-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: realtime-service
    ports:
      - "8091:8091"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka


  user-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: user-service
    ports:
      - "8092:8092"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: test $$(echo "rs.initiate({_id:'rs0',members:[{_id:0,host:\"mongodb:27017\"}]}).ok || rs.status().ok" | mongosh --port 27017 --quiet) -eq 1
      interval: 10s
      start_period: 15s

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    ports:
      - "8545:8545"
    command: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]

  # Microservices
  auth-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

  event-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: event-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

  ticket-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: ticket-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

  wallet-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: wallet-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

  blockchain-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: blockchain-service
    ports:
      - "8089:8089"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EVENTONE_BLOCKCHAIN_RPCURL=${EVENTONE_BLOCKCHAIN_RPCURL:-http://anvil:8545}
      - EVENTONE_TICKET_CONTRACT=${EVENTONE_TICKET_CONTRACT:-0xTBD}
      - EVENTONE_CREDENTIAL_CONTRACT=${EVENTONE_CREDENTIAL_CONTRACT:-0xTBD}
    depends_on:
      - mongodb
      - redis
      - kafka
      - anvil

  checkin-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: checkin-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

  credential-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: credential-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

  passport-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: passport-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

  verification-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: verification-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka
      
  ai-service:
    build:
      context: ./backend-spring
      args:
        SERVICE_NAME: ai-service
    ports:
      - "8090:8090"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/eventone
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - mongodb
      - redis
      - kafka

volumes:
  mongodb_data:


