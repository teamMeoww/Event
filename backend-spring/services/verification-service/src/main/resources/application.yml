server:
  port: 8088

spring:
  application:
    name: verification-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/eventone
    redis:
      host: localhost
      port: 8088
  kafka:
    bootstrap-servers: localhost:9092
    
eventone:
  services:
    blockchain: http://localhost:8089
    ticket: http://localhost:8083
    credential: http://localhost:8086
  blockchain:
    chainId: ${EVENTONE_BLOCKCHAIN_CHAINID:31337}
    rpcUrl: ${EVENTONE_BLOCKCHAIN_RPCURL:http://localhost:8545}
    ticketContract: ${EVENTONE_TICKET_CONTRACT:0xTBD}
    credentialContract: ${EVENTONE_CREDENTIAL_CONTRACT:0xTBD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
